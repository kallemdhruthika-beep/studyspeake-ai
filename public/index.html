@media(prefers-color-scheme:dark){

<script>

/* =========================================================
   BASIC HELPERS
========================================================= */

const esc = s =>

/* =========================================================
   SPEECH
========================================================= */

const SR =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition ||
  null;

function speak(text, rate = 1){

  try{

    if(!("speechSynthesis" in window)){
      return;
    }

    speechSynthesis.cancel();

    const u =
      new SpeechSynthesisUtterance(
        String(text).replace(/[‘’“”]/g,"")
      );

    u.rate = rate;
    u.lang = "en-IN";

    u.onstart = () => av("live");
    u.onend = () => av("");

    speechSynthesis.speak(u);

  }catch(e){
    console.error("Speech error:",e);
  }
}

function av(c){

  const a = $("#av");

  if(a){
    a.className = "avatar " + c;
  }
}

function say(text,rate=1){

  log("ai",text);
  speak(text,rate);
}

function log(w,text){

  const l = $("#log");

  if(!l) return;

  l.insertAdjacentHTML(
    "beforeend",
    `<div class="b ${w}">${esc(text)}</div>`
  );

  l.scrollTop = l.scrollHeight;
}


/* =========================================================
   ENGLISH CORRECTION ENGINE
========================================================= */

const RULES = [

  [
    /\bI am (completed|finished|done)\b/i,
    m => "I " + m[1],
    'Use simple past: "I completed", not "I am completed".'
  ],

  [
    /\bI want job\b/i,
    () => "I want a job",
    'Add the article "a" before "job".'
  ],

  [
    /\b(he|she) (go|have|do|like)\b/i,
    m =>
      m[1] + " " +
      ({
        go:"goes",
        have:"has",
        do:"does",
        like:"likes"
      })[m[2].toLowerCase()],
    "With he/she, the verb needs -s or -es."
  ],

  [
    /\bI am agree\b/i,
    () => "I agree",
    '"Agree" is already a verb, so do not add "am".'
  ],

  [
    /\byesterday I go\b/i,
    () => "yesterday I went",
    'Yesterday needs past tense: "went".'
  ],

  [
    /\bmore better\b/i,
    () => "better",
    'Use "better" alone, not "more better".'
  ],

  [
    /\bI am having (\d+) years?\b/i,
    m => "I am " + m[1] + " years old",
    'For age, say "I am 20 years old", not "I am having 20 years".'
  ],

  [
    /\bI didn't went\b/i,
    () => "I didn't go",
    'After "didn\'t", use the base verb "go".'
  ],

  [
    /\bI have went\b/i,
    () => "I have gone",
    'Use "have gone" with the present perfect.'
  ],

  [
    /\bhe don't\b/i,
    () => "he doesn't",
    'With "he", use "doesn\'t".'
  ],

  [
    /\bshe don't\b/i,
    () => "she doesn't",
    'With "she", use "doesn\'t".'
  ]

];


function analyze(s){

  const text = String(s || "").trim();

  const found = [];

  for(const rule of RULES){

    const match = text.match(rule[0]);

    if(match){

      found.push({
        wrong:match[0],
        right:rule[1](match),
        why:rule[2]
      });

    }

    if(found.length >= 2){
      break;
    }
  }

  const words =
    text
      ? text.split(/\s+/).filter(Boolean).length
      : 0;

  let fixed = text;

  for(const f of found){

    fixed = fixed.replace(
      f.wrong,
      f.right
    );

  }

  if(
    /job$/i.test(text) ||
    /I want a job$/i.test(fixed)
  ){

    fixed = fixed.replace(
      /,?\s*and I want a job\.?$/i,
      ", and I am looking for a job."
    );

  }

  if(fixed){

    fixed =
      fixed.charAt(0).toUpperCase() +
      fixed.slice(1);

    if(!/[.?!]$/.test(fixed)){
      fixed += ".";
    }

  }

  const uniqueWords =
    new Set(
      text
        .toLowerCase()
        .split(/\W+/)
        .filter(Boolean)
    ).size;

  const grammar =
    Math.max(
      4,
      10 - found.length * 2
    );

  const fluency =
    Math.min(
      9,
      Math.max(
        4,
        Math.round(words / 2) + 3
      )
    );

  const vocabulary =
    Math.min(
      9,
      5 + Math.floor(uniqueWords / 4)
    );

  return {
    found,
    fixed,
    g:grammar,
    f:fluency,
    v:vocabulary,
    tip:
      found.length
        ? "Say your corrected sentence aloud twice."
        : 'Try adding one linking word like "because" or "so".'
  };

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const nav = $("#nav");

  nav.innerHTML =
    NAV
      .map(n =>
        `<button class="nav ${view===n[0]?"on":""}"
          onclick="go('${n[0]}')">
          ${n[1]}
        </button>`
      )
      .join("");

  const views = {
    home,
    practice,
    study,
    progress
  };

  if(views[view]){

    $("#app").innerHTML =
      views[view]();

  }

  if(view === "practice"){
    bindPractice();
  }

  if(view === "study"){
    bindStudy();
  }

}


function go(v){

  if(call){
    endCall(true);
  }

  if("speechSynthesis" in window){
    speechSynthesis.cancel();
  }

  view = v;

  render();

  window.scrollTo(0,0);
}

function bindPractice(){

  const topicEl = $("#topic");

  if(topicEl){

    topicEl.onchange = e => {

      topic = e.target.value;

      if(call){
        ask();
      }

    };

  }

  const start = $("#start");

  if(start){
    start.onclick = startCall;
  }

  const end = $("#end");

  if(end){
    end.onclick = () => endCall();
  }

  const mute = $("#mute");

  if(mute){

    mute.onclick = () => {

      muted = !muted;

      mute.textContent =
        muted ? "Unmute" : "Mute";

      if(muted){

        stopRec();

        if("speechSynthesis" in window){
          speechSynthesis.cancel();
        }

      }

    };

  }

  const mic = $("#mic");

  if(mic){
    mic.onclick = toggleMic;
  }

  const send = $("#send");

  if(send){

    send.onclick = () => {

      const input = $("#typed");

      const value =
        input.value.trim();

      if(value){

        input.value = "";

        turn(value);

      }

    };

  }

  const typed = $("#typed");

  if(typed){

    typed.onkeydown = e => {

      if(e.key === "Enter"){
        $("#send").click();
      }

    };

  }

  document
    .querySelectorAll("[data-a]")
    .forEach(button => {

      button.onclick = () =>
        action(button.dataset.a);

    });

}


async function startCall(){

  const logBox = $("#log");

  if(logBox){
    logBox.innerHTML = "";
  }

  call = true;
  secs = 0;

  clearInterval(timer);

  timer = setInterval(() => {

    secs++;

    const min =
      String(Math.floor(secs / 60))
        .padStart(2,"0");

    const sec =
      String(secs % 60)
        .padStart(2,"0");

    const timerEl = $("#timer");

    if(timerEl){
      timerEl.textContent =
        `${min}:${sec}`;
    }

  },1000);

  $("#status").textContent =
    "Connected to StudySpeak AI Teacher";

  ["mic","mute","end"].forEach(id => {

    const el = $("#"+id);

    if(el){
      el.disabled = false;
    }

  });

  $("#start").disabled = true;

  if(SR && navigator.mediaDevices){

    try{

      const stream =
        await navigator.mediaDevices
          .getUserMedia({audio:true});

      stream
        .getTracks()
        .forEach(track => track.stop());

      $("#micmsg").textContent =
        "Microphone ready. Tap 🎤 and speak.";

    }catch(e){

      $("#micmsg").innerHTML =
        `<span class="err">
          Microphone blocked.
        </span>
        Allow microphone access or type below.`;

      $("#mic").disabled = true;
    }

  }else{

    $("#micmsg").textContent =
      "Speech recognition is not available here. Type your sentence below.";

    $("#mic").disabled = true;
  }

  say(
    "Hello! Welcome to StudySpeak. " +
    "I am your English teacher. " +
    "Let us practise " +
    topic +
    ". " +
    QS[topic]
  );

}


function ask(){

  say(QS[topic]);

}


function endCall(silent=false){

  clearInterval(timer);

  stopRec();

  call = null;

  if("speechSynthesis" in window){
    speechSynthesis.cancel();
  }

  if(silent){
    return;
  }

  const status = $("#status");

  if(status){
    status.textContent =
      "Call ended (" +
      ($("#timer")?.textContent || "00:00") +
      ")";
  }

  ["mic","mute","end"].forEach(id => {

    const el = $("#"+id);

    if(el){
      el.disabled = true;
    }

  });

  const start = $("#start");

  if(start){
    start.disabled = false;
  }

  av("");

  log(
    "ai",
    "Call ended. Great work today!"
  );

}


function toggleMic(){

  if(listening){
    stopRec();
  }else{
    startRec();
  }

}


function startRec(){

  if(!SR){

    $("#micmsg").textContent =
      "Speech recognition is not supported. Type your sentence instead.";

    return;
  }

  if(muted){

    $("#micmsg").textContent =
      "You are muted. Unmute first.";

    return;
  }

  if(!call){

    $("#micmsg").textContent =
      "Start the call first.";

    return;
  }

  if("speechSynthesis" in window){
    speechSynthesis.cancel();
  }

  try{

    rec = new SR();

    rec.lang = "en-IN";
    rec.interimResults = false;
    rec.continuous = false;

    rec.onstart = () => {

      listening = true;

      $("#mic").classList.add("on");

      av("listen");

      $("#micmsg").textContent =
        "Listening… speak now.";

    };

    rec.onresult = e => {

      const transcript =
        e.results[0][0].transcript;

      turn(transcript);

    };

    rec.onerror = e => {

      $("#micmsg").innerHTML =
        `<span class="err">
          Could not hear you (${esc(e.error)}).
        </span>
        Try again or type below.`;

    };

    rec.onend = () => {

      listening = false;

      const mic = $("#mic");

      if(mic){
        mic.classList.remove("on");
      }

      av("");

    };

    rec.start();

  }catch(e){

    console.error(e);

    listening = false;

  }

}


function stopRec(){

  try{

    if(rec){
      rec.stop();
    }

  }catch(e){}

  listening = false;

}


function turn(s){

  if(!call){
    return;
  }

  const text =
    String(s || "").trim();

  if(!text){
    return;
  }

  last = text;

  log("me",text);

  const r = analyze(text);

  const corrections =
    r.found.length
      ? r.found
          .map(f =>
            `<p class="corr">
              Important correction:
              “${esc(f.wrong)}”
              →
              <b>“${esc(f.right)}”</b>
              <br>
              <span class="mut">
                ${esc(f.why)}
              </span>
            </p>`
          )
          .join("")
      : `
        <p class="corr">
          <b>No major mistakes. Nice effort!</b>
        </p>
      `;

  $("#corr").innerHTML = `
    <h3>Correction card</h3>

    <p>
      <span class="mut">You said:</span>
      “${esc(text)}”
    </p>

    ${corrections}

    <p>
      Correct sentence:
      <b>${esc(r.fixed)}</b>
    </p>

    <div class="row">

      <span class="pill">
        Grammar ${r.g}/10
      </span>

      <span class="pill">
        Fluency ${r.f}/10
      </span>

      <span class="pill">
        Vocabulary ${r.v}/10
      </span>

    </div>

    <p>
      💡 ${esc(r.tip)}
    </p>
  `;

  last = r.fixed;

  const first = r.found[0];

  const reply = first
    ? `Good try. One small correction. Instead of saying ${first.wrong}, say ${first.right}. A better sentence is: ${r.fixed} Please repeat the sentence once.`
    : `Nice effort. You are improving. Let us say it naturally: ${r.fixed} Please repeat after me. Then tell me more.`;

  say(reply);

}


function action(a){

  if(!call){

    alert("Start the call first.");

    return;
  }

  if(a === "slow"){
    say(last || QS[topic],0.6);
  }

  if(a === "te"){

    say(
      last
        ? "Ippudu simple ga cheptanu. " +
          "Correct sentence ee la untundi: " +
          last +
          " Meeru kuda repeat cheyandi."
        : "Nenu oka simple question adugutanu. " +
          "Meeru English lo answer cheyandi. " +
          QS[topic]
    );

  }

  if(a === "ex"){

    say(
      "For example: I completed my B.Tech in 2025, and I am looking for a software job."
    );

  }

  if(a === "q"){
    ask();
  }

  if(a === "topic"){

    const index =
      TOPICS.indexOf(topic);

    topic =
      TOPICS[
        (index + 1) % TOPICS.length
      ];

    const topicEl = $("#topic");

    if(topicEl){
      topicEl.value = topic;
    }

    say(
      "Let us change the topic to " +
      topic +
      ". " +
      QS[topic]
    );

  }

}

function tabBody(){

  if(!studyData){

    Array.isArray(studyData.transcript)
      ? studyData.transcript
      : [];

  const points =
    Array.isArray(studyData.points)
      ? studyData.points
      : [];

  const screenContent =
    Array.isArray(studyData.screen_content)
      ? studyData.screen_content
      : [];

  const notes =
    Array.isArray(studyData.notes)
      ? studyData.notes
      : [];

  const flashcards =
    Array.isArray(studyData.flashcards)
      ? studyData.flashcards
      : [];

  switch(tab){

    case "Exact Transcript":

      return `
        <h3>Extracted / Video Transcript</h3>

          transcript.length
            ? transcript
                .map((s,i) =>
                  `<div class="seg">
                    <span class="ts">

                    ${esc(s)}

                .join("")
            : `

            `
        }
      `;


    case "Video/PDF Points":

      return `
        <h3>
          ${esc(studyData.title || "Key Points")}
        </h3>

        <p>
          ${esc(studyData.summary || "")}
        </p>

        ${
          points.length
            ? `<ul>

                  .map(p => `<li>${esc(p)}</li>`)
                  .join("")}

            : `<p class="mut">

              </p>`
        }
      `;


    case "Screen Content":

      return screenContent.length
        ? screenContent
            .map(s =>
              `<div class="screen">
                ${esc(
                  typeof s === "string"
                    ? s
                    : (s.content || "")
                )}
              </div>`
            )
            .join("")
        : `
          <p class="mut">
            No separate screen/formula content was detected.
          </p>
        `;


    case "Notes":

      return notes.length
        ? notes
            .map(n =>
              `<div class="seg">
                <h4 style="margin:10px 0 2px">
                  ${esc(n.title || "Note")}
                </h4>
                <div>
                  ${esc(n.content || "")}
                </div>
              </div>`
            )
            .join("")
        : `
          <p class="mut">
            No notes generated.
          </p>
        `;


    case "Flashcards":

      return flashcards.length
        ? `
          <div class="grid">

            ${flashcards
              .map((c,i) =>
                `<div
                  class="card fc"
                  onclick="
                    fcFlip[${i}] = !fcFlip[${i}];
                    render();
                  ">

                  ${
                    fcFlip[i]
                      ? esc(c.a || "")
                      : esc(c.q || "")
                  }

                </div>`
              )
              .join("")}

          </div>

          <p class="mut">
            Tap a card to flip it.
          </p>
        `
        : `
          <p class="mut">
            No flashcards generated.
          </p>
        `;


    case "Quiz":{

      const Q =
        Array.isArray(studyData.quiz)
          ? studyData.quiz
          : [];

      if(!Q.length){

        return `
          <p class="mut">
            No AI quiz was generated.
            Configure your backend AI key and upload the material again.
          </p>
        `;

      }

      if(quiz.done){

        return `
          <h3>
            Score: ${quiz.score}/${Q.length}
          </h3>

          <button
            class="btn pri"
            onclick="
              quiz={
                i:0,
                score:0,
                done:false,
                ans:null
              };
              render();
            ">
            Retry
          </button>
        `;

      }

      const q = Q[quiz.i];

      if(!q){
        return "<p>Quiz data is invalid.</p>";
      }

      const options =
        Array.isArray(q.options)
          ? q.options
          : [];

      return `
        <p class="mut">
          Question ${quiz.i+1} of ${Q.length}
        </p>

        <h3>
          ${esc(q.q || "Question")}
        </h3>

        ${
          options
            .map((o,i) =>
              `<button
                class="btn opt ${
                  quiz.ans !== null
                    ? (
                        i === q.answer
                          ? "good"
                          : i === quiz.ans
                            ? "wrong"
                            : ""
                      )
                    : ""
                }"
                onclick="pick(${i})"
                ${quiz.ans !== null ? "disabled" : ""}>
                ${esc(o)}
              </button>`
            )
            .join("")
        }

        ${
          quiz.ans !== null
            ? `
              <p>
                ${esc(q.explanation || "")}
              </p>

              <button
                class="btn pri"
                onclick="nextQ()">
                ${quiz.i + 1 < Q.length ? "Next" : "Finish"}
              </button>

            : ""

      `;

    case "Voice Teacher":

      return `

            </button>

              class="btn"

            </button>

              class="btn"

            </button>

            <button
              class="btn"
              data-t="q">
              Ask Me a Question
            </button>

            <button
              class="btn"
              data-t="quiz">
              Start Oral Quiz
            </button>

            <button
              class="btn red"
              data-t="end">
              End Class
            </button>

          </div>

          <div
            class="row"
            style="margin-top:12px">

            <input
              id="doubt"
              placeholder="Ask a doubt"
              style="flex:1">

            <button
              class="btn"
              id="ask">
              Ask
            </button>

          </div>

          <div
            class="log"
            id="log"
            aria-live="polite">
          </div>

        </div>
      `;

    default:

      return "<p>Choose a study tab.</p>";
  }

}


function pick(i){

  if(!studyData || !Array.isArray(studyData.quiz)){
    return;
  }

  const q =
    studyData.quiz[quiz.i];

  if(!q){
    return;
  }

  if(quiz.ans !== null){
    return;
  }

  quiz.ans = i;

  if(i === q.answer){
    quiz.score++;
  }

  render();

}


function nextQ(){

  quiz.ans = null;

  if(
    studyData &&
    Array.isArray(studyData.quiz) &&
    quiz.i + 1 < studyData.quiz.length
  ){

    quiz.i++;

  }else{

    quiz.done = true;

  }

  render();

}

async function uploadPDF(file){

  const up = $("#up");

  if(up){

    up.innerHTML =
      `Uploading ${esc(file.name)}…
       <div class="bar" style="width:25%"></div>`;

  }

  const fd = new FormData();

  fd.append("file",file);

  try{

    if(up){

      up.innerHTML =
        `Processing ${esc(file.name)}…
         <div class="bar" style="width:60%"></div>`;
    }

    const response =
      await fetch(
        "/api/material",
        {
          method:"POST",
          body:fd
        }
      );

    let data;

    try{
      data = await response.json();
    }catch(e){
      throw new Error(
        "Server returned an invalid response."
      );
    }

    if(!response.ok){

      throw new Error(
        data.error || "Upload failed."
      );

    }

    studyData = data;

    material = file.name;

    tab = "Exact Transcript";

    quiz = {
      i:0,
      score:0,
      done:false,
      ans:null
    };

    fcFlip = {};

    render();

  }catch(e){

    console.error(e);

    if(up){

      up.innerHTML =
        `<span class="err">
          ${esc(e.message || "Upload failed.")}
        </span>`;

    }

  }

}

function getYouTubeId(url){

  try{

    const u = new URL(url);

    if(
      u.hostname.includes("youtube.com") &&
      u.searchParams.get("v")
    ){
      return u.searchParams.get("v");
    }

    if(
      u.hostname === "youtu.be"
    ){
      return u.pathname.slice(1);
    }

    if(
      u.pathname.startsWith("/shorts/")
    ){
      return u.pathname.split("/")[2];
    }

  }catch(e){}

  return null;
}


function showVideoPreview(url){

  const id = getYouTubeId(url);

  if(!id){
    return "";
  }

  return `
    <iframe
      class="video-preview"
      src="https://www.youtube.com/embed/${encodeURIComponent(id)}"
      title="Educational video"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  `;
}

  try{

    await fetch(

        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            url:url,

              lang === "te"
                ? "telugu-english"
                : lang === "si"

          /api/video endpoint.

}

function normalizeStudyData(data,title){

  const d = data || {};

  return {

    title:
      d.title ||
      title,

    summary:
      d.summary ||
      "",

    transcript:
      Array.isArray(d.transcript)
        ? d.transcript
        : d.transcript
          ? [String(d.transcript)]
          : [],

    points:
      Array.isArray(d.points)
        ? d.points
        : [],

    screen_content:
      Array.isArray(d.screen_content)
        ? d.screen_content
        : [],

    notes:
      Array.isArray(d.notes)
        ? d.notes
        : [],

    flashcards:
      Array.isArray(d.flashcards)
        ? d.flashcards
        : [],

    quiz:
      Array.isArray(d.quiz)
        ? d.quiz
        : [],

    voice_intro:
      d.voice_intro ||
      "Hello! Let us learn from this material.",

    demoMode:
      !!d.demoMode

  };

}

   STUDY PAGE BINDINGS

function bindStudy(){

  const h = (id,fn) => {

    const e = $(id);

    if(e){
      e.onclick = fn;
    }

  };


  /* ---------- Transcript ---------- */

  h("#usetxt",() => {

    const input = $("#txt");

    if(!input){
      return;
    }

    const value =
      input.value.trim();

    if(value.length < 20){

      $("#up").innerHTML =
        `<span class="err">
          Paste at least a few sentences.
        </span>`;

      return;
    }

    studyData = normalizeStudyData(
      {
        title:"Pasted study material",

        transcript:
          value
            .split(/\n+/)
            .map(x => x.trim())
            .filter(Boolean),

        summary:value,

        points:
          value
            .split(/[.!?]+/)
            .map(x => x.trim())
            .filter(Boolean)
            .slice(0,8),

        screen_content:[],
        notes:[],
        flashcards:[],
        quiz:[],

        voice_intro:
          "Let us study this material."
      },
      "Pasted study material"
    );

    material =
      "Pasted study material";

    tab =
      "Exact Transcript";

    quiz = {
      i:0,
      score:0,
      done:false,
      ans:null
    };

    fcFlip = {};

    render();

  });


  /* ---------- PDF ---------- */

  const pdf = $("#pdf");

  if(pdf){

    pdf.onchange = () => {

      const file =
        pdf.files[0];

      if(!file){
        return;
      }

      const allowed = [
        "application/pdf",
        "image/png",
        "image/jpeg",
        "image/webp"
      ];

      if(!allowed.includes(file.type)){

        $("#up").innerHTML =
          `<span class="err">
            Please choose a PDF, PNG, JPG or WEBP image.
          </span>`;

        return;
      }

      if(file.size > 50 * 1048576){

        $("#up").innerHTML =
          `<span class="err">
            File is over 50 MB.
          </span>`;

        return;
      }

      uploadPDF(file);

    };

  }


  /* ---------- Video ---------- */

  h("#analyzeVideo",analyzeVideo);


  /* ---------- Voice Teacher ---------- */

  document
    .querySelectorAll("[data-t]")
    .forEach(button => {

      button.onclick = () =>
        teach(button.dataset.t);

    });


  h("#vc",() => {

    const logBox = $("#log");

    if(logBox){
      logBox.innerHTML = "";
    }

    say(
      studyData?.voice_intro ||
      "Hello! Let us learn from your uploaded material."
    );

  });


  /* ---------- Ask Doubt ---------- */

  h("#ask",async() => {

    const doubt = $("#doubt");

    if(!doubt){
      return;
    }

    const value =
      doubt.value.trim();

    if(!value){
      return;
    }

    doubt.value = "";

    log("me",value);

    try{

      const response =
        await fetch(
          "/api/teach",
          {
            method:"POST",
            headers:{
              "Content-Type":"application/json"
            },
            body:JSON.stringify({

              source:
                (studyData?.transcript || [])
                  .join("\n"),

              question:value,

              mode:
                lang === "te"
                  ? "telugu-english"
                  : lang === "si"
                    ? "simple"
                    : "english"

            })
          }
        );

      let data;

      try{
        data = await response.json();
      }catch(e){
        throw new Error(
          "Teacher server returned an invalid response."
        );
      }

      if(!response.ok){

        throw new Error(
          data.error ||
          "Teacher could not answer."
        );

      }

      say(
        data.answer ||
        data.error ||
        "No answer returned."
      );

    }catch(e){

      console.error(e);

      say(
        "Teacher could not answer right now."
      );

    }

  });

}


/* =========================================================
   VOICE TEACHER ACTIONS
========================================================= */

function teach(action){

  const text =
    (studyData?.transcript || [])
      .join(" ");

  const notes =
    studyData?.notes || [];

  const fallback =
    text.slice(0,500) ||
    studyData?.summary ||
    "There is no study content available yet.";

  const firstQuiz =
    Array.isArray(studyData?.quiz) &&
    studyData.quiz.length
      ? studyData.quiz[0]
      : null;

  const actions = {

    pause:() => {

      if("speechSynthesis" in window){
        speechSynthesis.cancel();
      }

    },

    slow:() =>
      say(fallback,0.6),

    simple:() =>
      say(
        "In simple words: " +
        (studyData?.summary || fallback)
      ),

    te:() =>
      say(
        "Simple ga cheppalante: " +
        (studyData?.summary || fallback)
      ),

    ex:() =>
      say(
        notes[0]?.content ||
        fallback
      ),

    q:() =>
      say(
        firstQuiz?.q ||
        "Tell me one important point from this lesson."
      ),

    quiz:() =>
      say(
        firstQuiz?.q ||
        "Tell me one important point from this lesson."
      ),

    end:() => {

      if("speechSynthesis" in window){
        speechSynthesis.cancel();
      }

      log(
        "ai",
        "Class ended. Well done!"
      );

    }

  };

  if(actions[action]){
    actions[action]();
  }

}

/* =========================================================
   LANGUAGE + THEME
========================================================= */

const langSelect = $("#lang");

if(langSelect){

  langSelect.onchange = e => {

    lang = e.target.value;

    if(lang === "te"){

      alert(
        "Telugu-English mode enabled. " +
        "Explanations will use Telugu written in English letters."
      );

    }

  };

}


const themeButton = $("#theme");

if(themeButton){

  themeButton.onclick = () => {

    const root =
      document.documentElement;

    const isDark =
      root.dataset.theme === "dark" ||
      (
        !root.dataset.theme &&
        window.matchMedia(
          "(prefers-color-scheme:dark)"
        ).matches
      );

    root.dataset.theme =
      isDark
        ? "light"
        : "dark";

  };

}


/* =========================================================
   START APP
========================================================= */

render();
